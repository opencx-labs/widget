name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: pnpm lint
          - name: type-check
            run: pnpm type-check
          - name: test
            run: pnpm test
          - name: test:browser
            run: pnpm exec vitest run --project react-browser
            browser: true
          - name: test:e2e
            run: pnpm -F @opencx/widget test:e2e
            browser: true
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages resolve each other's types and code from dist, so every check
      # needs the build. It also runs the production-JSX guard.
      - run: pnpm build
      - if: matrix.browser
        run: pnpm exec playwright install --with-deps chromium
      - run: ${{ matrix.run }}
