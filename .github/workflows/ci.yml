name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job, cheapest check first: each step runs only if every earlier one
# passed, and setup (install, build) is paid once instead of once per check.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      # Packages resolve each other's types and code from dist, so type-check and
      # tests need the build. It also runs the production-JSX guard.
      - run: pnpm build
      - name: type-check
        run: pnpm type-check
      - name: test
        run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - name: test:browser
        run: pnpm exec vitest run --project react-browser
      - name: test:e2e
        run: pnpm -F @opencx/widget test:e2e
